# Render Blueprint — TOP TEA TALENTS API (one-click deploy).
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
# This creates ONE service: the API server. The front end lives on GitHub Pages.
#
# HONEST COST / LIMITS (Render docs, "Deploy for Free"):
# - plan: free = $0/month. The service sleeps after 15 minutes with no traffic
#   and takes ~1 minute to wake on the next request. 750 free instance hours
#   per workspace per month.
# - Free web services CANNOT attach a persistent disk, and their filesystem is
#   ephemeral: the SQLite file is LOST on every redeploy, restart, or
#   spin-down. On every boot the server re-seeds the bundled opportunities /
#   production-intel / sources from its own files — and, if a ledger mirror
#   is available (local file or MIRROR_URL), it ALSO replays the mirror
#   first, restoring talents, consents, reviews, applications and bookings
#   (see MIRROR.md). Without Turso or the activated mirror recorder, a full
#   restart still loses user data: the mirror file itself lives on the same
#   ephemeral filesystem. Treat the data as durable only when Turso is set
#   or the recorder (prototype/ledger-mirror-recorder.yml) is live.
# - DURABILITY (FREE-ONLY LAW): NO paid tier, ever. The free durable path is
#   Turso (libSQL, free tier): set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN below
#   and the API stores everything in Turso instead of the ephemeral SQLite
#   file. Do NOT propose the Starter plan or a paid disk.
# - ADMIN_TOKEN is generated by Render (generateValue) — keep it secret; it is
#   the Bearer token for the admin endpoints. PUBLIC_URL is set after the first
#   deploy to the service's public URL.
# - FIXED 2026-11-21: env vars the owner sets in the dashboard (TURSO_*,
#   MIRROR_URL, PUBLIC_URL) carry sync:false and NO value — Render rejects a
#   var that specifies both a value and sync:false, which is why the first
#   Blueprint apply failed. Do not add value lines back to those entries.
# - autoDeployTrigger is OFF on purpose: auto-deploy ON caused wipe storms on
#   ReacheR (a redeploy wipes the free filesystem). Deploys are manual only.

services:
  - type: web
    name: top-tea-talents-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: /data/top-tea-talents.db
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # MIRROR_URL: raw URL of the ledger mirror on the `ledger` branch
      # (see MIRROR.md). When the local DB is empty after a wipe and no
      # local mirror exists, the server fetches this copy, verifies its
      # hash chain, and replays it. Empty until the mirror recorder
      # (prototype/ledger-mirror-recorder.yml) is activated.
      - key: MIRROR_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        sync: false
    # --- Durability is Turso (free) or ephemeral demo SQLite. No disk, no paid plan. ---
