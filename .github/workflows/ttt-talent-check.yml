name: ttt-talent-check (one-off diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read second talent record (admin)
        env:
          TTT_ADMIN_TOKEN: ${{ secrets.TTT_ADMIN_TOKEN }}
          API: https://top-tea-talents-api.onrender.com
        run: |
          set -e
          echo "--- talent tal_4915800fb8534d44 ---"
          curl -s -m 60 -H "Authorization: Bearer $TTT_ADMIN_TOKEN" "$API/api/v1/talent/tal_4915800fb8534d44" | python3 -c "import json,sys; d=json.load(sys.stdin); t=d.get('talent') or d; p=t.get('profile') or t; print('name:', p.get('firstName'), p.get('lastName'), '| pro:', p.get('professionalName')); print('email:', p.get('email')); print('completion:', d.get('completion') or p.get('completion'), '| core:', p.get('coreCompletion'), '| status:', p.get('status')); print('consent:', p.get('consent')); print('photoCount:', t.get('photoCount')); print('socialVerified:', d.get('socialVerified')); print('categories:', p.get('categories')); print('availability:', p.get('availability')); print('ageRange:', p.get('ageRange'), '| city:', p.get('city'), '| zip:', p.get('zip'), '| radius:', p.get('travelRadius')); print('automation:', p.get('automation')); print('checklist undone:', [c['label'] for c in (p.get('completionChecklist') or []) if not c.get('done')])"
          echo "--- fast-track ---"
          curl -s -m 60 -H "Authorization: Bearer $TTT_ADMIN_TOKEN" "$API/api/v1/talent/tal_4915800fb8534d44/fast-track" | head -c 800; echo
