# TTT mirror diagnose — ONE-OFF diagnostic, delete after use.
# Runs the admin-gated mirror calls inside GitHub Actions, where
# secrets.TTT_ADMIN_TOKEN is available. The token NEVER appears in logs:
# this workflow prints only HTTP status codes, line counts, and the
# verify/rebuild JSON (no secrets, no mirror content).
name: TTT mirror diagnose (one-off)

on:
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror status, verify, rebuild if missing
        env:
          API_URL: ${{ vars.TTT_API_URL }}
          ADMIN_TOKEN: ${{ secrets.TTT_ADMIN_TOKEN }}
        run: |
          set -u
          echo "--- health ---"
          curl -s -o /dev/null -w "health HTTP %{http_code}\n" "$API_URL/api/v1/health" || true
          echo "--- GET mirror (status + line count only) ---"
          MIRROR_STATUS=$(curl -s -o /tmp/mirror.jsonl -w "%{http_code}" -H "Authorization: Bearer $ADMIN_TOKEN" "$API_URL/api/v1/ledger/mirror" || true)
          echo "mirror HTTP $MIRROR_STATUS"
          if [ "$MIRROR_STATUS" = "200" ]; then echo "mirror lines: $(wc -l < /tmp/mirror.jsonl)"; fi
          echo "--- GET mirror/verify ---"
          curl -s -H "Authorization: Bearer $ADMIN_TOKEN" "$API_URL/api/v1/ledger/mirror/verify" || true
          echo
          if [ "$MIRROR_STATUS" = "404" ]; then
            echo "--- POST mirror/rebuild (local mirror file is missing) ---"
            curl -s -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "$API_URL/api/v1/ledger/mirror/rebuild" || true
            echo
            echo "--- GET mirror again ---"
            MIRROR_STATUS2=$(curl -s -o /tmp/mirror2.jsonl -w "%{http_code}" -H "Authorization: Bearer $ADMIN_TOKEN" "$API_URL/api/v1/ledger/mirror" || true)
            echo "mirror HTTP $MIRROR_STATUS2"
            if [ "$MIRROR_STATUS2" = "200" ]; then echo "mirror lines: $(wc -l < /tmp/mirror2.jsonl)"; fi
          fi
