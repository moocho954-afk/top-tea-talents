name: ttt-emergency-review (one-off)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Emergency agency review PASS for both talents
        env:
          TTT_ADMIN_TOKEN: ${{ secrets.TTT_ADMIN_TOKEN }}
          API: https://top-tea-talents-api.onrender.com
        run: |
          set -e
          for id in tal_a8e01279ace84ed4 tal_4915800fb8534d44; do
            echo "--- review $id ---"
            curl -s -m 60 -X POST -H "Authorization: Bearer $TTT_ADMIN_TOKEN" -H "Content-Type: application/json" -d '{"decision":"PASS"}' "$API/api/v1/talent/$id/review" | python3 -c "import json,sys; d=json.load(sys.stdin); print('decision:', d.get('decision'), '| status:', d.get('status'), '| error:', d.get('error'))"
          done
          for id in tal_a8e01279ace84ed4 tal_4915800fb8534d44; do
            echo "--- verify $id ---"
            curl -s -m 60 -H "Authorization: Bearer $TTT_ADMIN_TOKEN" "$API/api/v1/talent/$id" | python3 -c "import json,sys; d=json.load(sys.stdin); t=d.get('talent') or d; p=t.get('profile') or t; print('name:', p.get('firstName'), p.get('lastName'), '| status:', p.get('status'), '| completion:', d.get('completion') or p.get('completion'), '| core:', p.get('coreCompletion'))"
          done
